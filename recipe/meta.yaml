{% set name = "occt" %}
{% set version = "8.0.1" %}
{% set build = 1002 %}  # AstoCAD: above conda-forge's build numbers; one more per AstoCAD tag

{% set build = build + 100 %}   # [variant == "novtk"]
{% set build = build + 200 %}   # [variant == "all"]


package:
  name: {{ name }}
  version: {{ version }}

source:
  # AstoCAD: realthunder/OCCT LinkVibe-801 (8.0.1) + BRepFeat_Form fix (realthunder/OCCT#5),
  # with BRepGProp and BRep_CurveRepresentation back to upstream 8.0.1 and a faster Thickness
  fn: {{ name }}-{{ version }}-astocad2.tar.gz
  url: https://github.com/AstoCAD/OCCT/archive/refs/tags/V8_0_1-astocad2.tar.gz
  sha256: 549ee251bcad7e7870339a3b636fea1e58673ede136d8aba21ef76c8a160fa5b
  patches:
    - patches/switch-vtk-freetype-cmake-order.patch

build:
  number: {{ build }}
  string: {{ variant }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    # ABI changes between minor versions, see e.g.
    # https://github.com/conda-forge/occt-feedstock/issues/97
    - {{ pin_subpackage('occt', max_pin='x.x.x') }}
  script_env:
    - USE_VTK=OFF  # [variant=='novtk']
    - USE_VTK=ON  # [variant=='all']

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - expat
    - fontconfig
    - freeimage
    - freetype
    - libgl-devel                   # [linux]
    - rapidjson
    - tbb-devel                     # [variant=='all']
    - vtk                           # [variant=='all']
    - xorg-libx11                   # [linux]
    - xorg-libxt                    # [linux]
    - xorg-xorgproto                # [linux]
    - xorg-libxext                  # [linux]
    - xorg-libxi                    # [linux]
  run:
    - freetype
    - freeimage
    - fontconfig
    - xorg-libxt  # [linux]
    - rapidjson
    - vtk  # [variant=='all']

test:
  requires:
    - ninja
    - cmake
  files:
    - CMakeLists.txt
  commands:
    - cmake -G "Ninja" -DOCCT_VERSION="{{ version }}" .

about:
  home: https://www.opencascade.com/
  license_family: LGPL
  license: LGPL-2.1-only
  license_file: LICENSE_LGPL_21.txt
  summary: this is the occ (opencascade) CAD-Kernel
  description: |
    Open Cascade Technology (OCCT), formerly called CAS.CADE
    is an open source software development platform for 3D CAD,
    CAM, CAE, etc. that is developed and supported by Open Cascade SAS.
  doc_url: https://www.opencascade.com/content/documentation
  dev_url: http://git.dev.opencascade.org/gitweb/?p=occt.git

extra:
  recipe-maintainers:
    - adam-urbanczyk
    - oursland
    - adrianinsaval
    - looooo
