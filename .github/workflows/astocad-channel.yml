# AstoCAD: build occt from AstoCAD/OCCT (realthunder's fork + patch) with conda-forge's own
# recipe and build scripts, then publish the packages as a conda channel on GitHub Pages:
#   https://astocad.github.io/occt-feedstock
# Only the "all" variant (with VTK) is built: it is the one FreeCAD/AstoCAD uses.
name: Build AstoCAD occt channel
on:
  workflow_dispatch:
  push:
    branches: [astocad]

permissions:
  contents: write

concurrency:
  group: astocad-channel
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.CONFIG }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - CONFIG: linux_64_variantall
            os: ubuntu
            runs_on: ubuntu-latest
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            build_workspace_dir: build_artifacts
            tools_install_dir: ~/miniforge3
          - CONFIG: linux_aarch64_variantall
            os: ubuntu
            runs_on: ubuntu-latest
            DOCKER_IMAGE: quay.io/condaforge/linux-anvil-x86_64:alma10
            build_workspace_dir: build_artifacts
            tools_install_dir: ~/miniforge3
          - CONFIG: osx_64_variantall
            os: macos
            runs_on: macos-15-intel
            build_workspace_dir: /Users/runner/miniforge3/conda-bld
            tools_install_dir: ~/miniforge3
          - CONFIG: osx_arm64_variantall
            os: macos
            runs_on: macos-15-intel
            build_workspace_dir: /Users/runner/miniforge3/conda-bld
            tools_install_dir: ~/miniforge3
          - CONFIG: win_64_variantall
            os: windows
            runs_on: windows-2022
            build_workspace_dir: C:\bld\
            tools_install_dir: C:\Miniforge
    steps:
      - uses: actions/checkout@v4

      - name: Configure binfmt_misc
        if: matrix.os == 'ubuntu'
        shell: bash
        run: docker run --rm --privileged multiarch/qemu-user-static:register --reset --credential yes

      - name: Build on Linux
        if: matrix.os == 'ubuntu'
        shell: bash
        env:
          CI: github_actions
          CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
          CONFIG: ${{ matrix.CONFIG }}
          MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
          DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }}
          UPLOAD_PACKAGES: "False"
          IS_PR_BUILD: "False"
        run: |
          export CONDA_BLD_PATH="${CONDA_BLD_PATH/#~/${HOME}}"
          export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
          export GIT_BRANCH="${GITHUB_REF_NAME}"
          export MINIFORGE_HOME="${MINIFORGE_HOME/#~/${HOME}}"
          ./.scripts/run_docker_build.sh

      - name: Build on macOS
        if: matrix.os == 'macos'
        shell: bash
        env:
          CI: github_actions
          CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
          CONFIG: ${{ matrix.CONFIG }}
          MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
          UPLOAD_PACKAGES: "False"
          IS_PR_BUILD: "False"
        run: |
          export CONDA_BLD_PATH="${CONDA_BLD_PATH/#~/${HOME}}"
          export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
          export GIT_BRANCH="${GITHUB_REF_NAME}"
          export MINIFORGE_HOME="${MINIFORGE_HOME/#~/${HOME}}"
          ./.scripts/run_osx_build.sh

      - name: Build on Windows
        if: matrix.os == 'windows'
        shell: cmd
        env:
          CI: github_actions
          CONDA_BLD_PATH: ${{ matrix.build_workspace_dir }}
          CONFIG: ${{ matrix.CONFIG }}
          MINIFORGE_HOME: ${{ matrix.tools_install_dir }}
          PYTHONUNBUFFERED: 1
          UPLOAD_PACKAGES: "False"
          IS_PR_BUILD: "False"
        run: call ".scripts\run_win_build.bat"

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p out
          for d in build_artifacts "$HOME/miniforge3/conda-bld" /c/bld; do
            [ -d "$d" ] && find "$d" -name 'occt-*.conda' -exec cp {} out/ \; || true
          done
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.CONFIG }}
          path: out/*.conda

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
      - name: Build the channel
        shell: bash
        run: |
          set -e
          mkdir -p channel/noarch
          for f in pkgs/*/*.conda; do
            case "$f" in
              *linux_64*) sub=linux-64;; *linux_aarch64*) sub=linux-aarch64;;
              *osx_64*) sub=osx-64;; *osx_arm64*) sub=osx-arm64;; *win_64*) sub=win-64;;
            esac
            mkdir -p channel/$sub && cp "$f" channel/$sub/
          done
          pip install conda-index
          python -m conda_index channel
          echo "# AstoCAD occt channel" > channel/index.md
          find channel -type f | sort
      - name: Publish to gh-pages
        shell: bash
        run: |
          cd channel
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "AstoCAD occt channel from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
